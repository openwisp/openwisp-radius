# Isolated REST reply regression server with synthetic credentials.
name = radiusd
prefix = /usr
localstatedir = /tmp
logdir = /tmp
pidfile = /tmp/openwisp-radius-policy-test.pid
log {
    destination = stdout
    auth = no
}
security {
    allow_core_dumps = no
}
client localhost {
    ipaddr = 127.0.0.1
    secret = local-policy-test
    require_message_authenticator = yes
}
modules {
    always accept {
        rcode = ok
    }
    expr {}
    rest {
        connect_uri = http://127.0.0.1:__REST_PORT__
        authorize {
            uri = http://127.0.0.1:__REST_PORT__/authorize
            method = post
            body = json
        }
        pool {
            start = 0
            min = 0
            max = 2
            spare = 1
            uses = 0
        }
    }
}
policy {
    $INCLUDE /probe/normalize_session_timeout
}
server probe {
    listen {
        type = auth
        ipaddr = 127.0.0.1
        port = __RADIUS_PORT__
    }
    authorize {
        update control {
            Auth-Type := Accept
        }
        if (&request:NAS-Port) {
            update reply {
                Session-Timeout := &request:NAS-Port
            }
        }
        rest
    }
    authenticate {
        Auth-Type Accept {
            accept
        }
    }
    post-auth {
        normalize_session_timeout
    }
}
