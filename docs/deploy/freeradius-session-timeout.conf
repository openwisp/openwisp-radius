# Call after reply-producing policies. rlm_rest can append a larger <= value
# while retaining a shorter timeout, but Access-Accept permits only one.
# This policy reserves control:Tmp-Integer-0 as scratch space.
normalize_session_timeout {
    if (&reply:Session-Timeout) {
        update control {
            Tmp-Integer-0 := &reply:Session-Timeout
        }
        foreach &reply:Session-Timeout {
            if (&control:Tmp-Integer-0 > "%{Foreach-Variable-0}") {
                update control {
                    Tmp-Integer-0 := "%{Foreach-Variable-0}"
                }
            }
        }
        # Clear every duplicate before restoring the single minimum.
        update reply {
            Session-Timeout !* ANY
        }
        update reply {
            Session-Timeout := &control:Tmp-Integer-0
        }
        update control {
            Tmp-Integer-0 !* ANY
        }
    }
}
