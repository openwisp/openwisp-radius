---
name: OpenWISP RADIUS CI Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: >-
      ${{ matrix.tsdb }} | Python==${{ matrix.python-version }} |
      ${{ matrix.django-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
        django-version:
          - django~=4.2.0
          - django~=5.1.0
          - django~=5.2.0
        tsdb:
          - influxdb
        exclude:
          # Python 3.13 supported only in Django >=5.1.3
          - python-version: "3.13"
            django-version: django~=4.2.0
        # The other timeseries backends are tested only on the latest Python
        # and Django versions, and only on the monitoring integration.
        include:
          - python-version: "3.13"
            django-version: django~=5.2.0
            tsdb: influxdb2

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Cache APT packages
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Disable man page auto-update
        run: |
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null
          sudo dpkg-reconfigure man-db

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            **/requirements*.txt

      - name: Install Dependencies
        id: deps
        run: |
          sudo apt update -qq
          sudo apt-get -qq -y install xmlsec1 gettext \
              sqlite3 \
              fping \
              gdal-bin \
              libproj-dev \
              libgeos-dev \
              libspatialite-dev \
              spatialite-bin \
              libsqlite3-mod-spatialite
          sudo npm install -g prettier
          pip install -U pip wheel setuptools
          pip install -U -r requirements-test.txt
          pip install -e .[saml,openvpn_status]
          pip install -U ${{ matrix.django-version }}

      - name: Start Timeseries DB and Redis container
        run: |
          docker compose up -d "${{ matrix.tsdb }}" redis

          if [ "${{ matrix.tsdb }}" = "influxdb2" ]; then
            url="http://localhost:8087/health"
          else
            url="http://localhost:8086/query?q=SHOW%20DATABASES"
          fi

          for attempt in $(seq 1 30); do
            if curl -fsS "$url" > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done

          echo "Timeseries DB did not become ready at $url"
          docker compose logs "${{ matrix.tsdb }}"
          exit 1

      - name: QA checks
        run: |
          ./run-qa-checks

      - name: Tests
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' }}
        run: |
          ./runtests
        env:
          MONITORING_INTEGRATION: ${{ matrix.tsdb != 'influxdb' && '1' || '' }}
          TIMESERIES_BACKEND: ${{ matrix.tsdb }}
          SELENIUM_HEADLESS: 1
          GECKO_LOG: 1
          COVERAGE_PROCESS_START: pyproject.toml

      - name: Show gecko web driver log on failures
        if: ${{ failure() }}
        run: cat geckodriver.log

      - name: Upload Coverage
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' }}
        uses: coverallsapp/github-action@v2
        with:
          parallel: true
          format: cobertura
          flag-name: ${{ matrix.tsdb }}-python-${{ matrix.python-version }}-${{ matrix.django-version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  coveralls:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
